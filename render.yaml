# Render blueprint for the Spring Boot backend.
# The frontend deploys separately on Vercel (see README).
services:
  - type: web
    name: carmatch-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/ai/status
    envVars:
      - key: GEMINI_API_KEY
        sync: false # set this in the Render dashboard
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL, e.g. https://carmatch.vercel.app
