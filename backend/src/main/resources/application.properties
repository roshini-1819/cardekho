spring.application.name=carmatch

# --- Persistence: Postgres. ---
spring.datasource.url=jdbc:postgresql://localhost:5432/carmatch
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 8080 is commonly taken (e.g. a local Apache); default to 8090.
server.port=${SERVER_PORT:8090}

# --- AI provider (Gemini). Set GEMINI_API_KEY to enable AI recommendations; ---
# without it the app cleanly falls back to the deterministic scoring engine.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# Comma-separated origins allowed to call the API (the Vite dev server + prod URL)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
